name = "shikati"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# سجل الخادم في لوحة كلاود فلير (لا يحتوي أي سر)
[observability]
enabled = true

# الواجهة: ملفات ثابتة يقدّمها الخادم نفسه
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "shikati"
# معرّف قاعدة D1 في حساب كلاود فلير (ليس سراً)
database_id = "594d9216-3241-44e8-adf7-06e32b44f6e3"
migrations_dir = "migrations"

[vars]
ZOHO_ORG_ID = "904099546"
ZOHO_API_BASE = "https://www.zohoapis.com/books/v3"
ZOHO_ACCOUNTS_URL = "https://accounts.zoho.com"
SESSION_HOURS = "12"
# من يستطيع تسجيل الإيداع: "admin" للتجربة الأولى، ثم "admin,depositor" لأمين
DEPOSIT_ROLES = "admin,depositor"

# الأسرار لا تُكتب هنا أبداً. تُضاف بالأوامر:
#   npx wrangler secret put ZOHO_CLIENT_ID
#   npx wrangler secret put ZOHO_CLIENT_SECRET
#   npx wrangler secret put ZOHO_REFRESH_TOKEN
#   npx wrangler secret put SETUP_TOKEN   (مؤقت، لصفحة /setup فقط)
#   npx wrangler secret put ANTHROPIC_API_KEY   (قراءة صورة الشيك بكلود)
# من يستطيع تسجيل شيك جديد: REGISTER_ROLES، والافتراضي في الشيفرة "admin,depositor"
