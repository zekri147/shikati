<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d73237">
<title>شيكاتي — الإدارة</title>
<link rel="icon" href="/img/symbol-red.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js"></script>
<script src="/js/admin.js" defer></script>
</head>
<body>
<header class="topbar">
  <img class="logo" src="/img/logo-white.svg" alt="إيلوناك">
  <div class="actions">
    <a class="btn btn-ghost" href="/">الشيكات</a>
    <button type="button" class="btn-ghost" data-theme-toggle>فاتح</button>
    <button type="button" class="btn-ghost" id="logout">خروج</button>
  </div>
</header>
<main>
  <section class="block">
    <div class="block-head"><h2>المستخدمون</h2></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الاسم</th><th>اسم الدخول</th><th>الدور</th><th>الحالة</th><th>إجراءات</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </section>

  <section class="block">
    <div class="block-head"><h2>إضافة مستخدم</h2></div>
    <form id="new-user" novalidate>
      <div class="grid-form">
        <div><label for="nu-display">الاسم الظاهر</label><input id="nu-display" name="display_name" required></div>
        <div><label for="nu-username">اسم الدخول</label><input id="nu-username" name="username" dir="ltr" autocapitalize="none" spellcheck="false" required></div>
        <div><label for="nu-role">الدور</label>
          <select id="nu-role" name="role"><option value="depositor">مودِع</option><option value="admin">مدير</option></select></div>
        <div><label for="nu-password">الرمز السري (8 أحرف على الأقل)</label><input id="nu-password" name="password" type="password" autocomplete="new-password" dir="ltr" required></div>
      </div>
      <div class="form-error" id="nu-error" role="alert"></div>
      <button type="submit" class="btn-primary">إضافة</button>
    </form>
  </section>

  <section class="block">
    <div class="block-head"><h2>سجل العمليات</h2><span class="meta">آخر 200 عملية</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>الهدف</th><th>النتيجة</th></tr></thead>
        <tbody id="audit"></tbody>
      </table>
    </div>
  </section>
</main>
<footer class="foot"><img src="/img/symbol-red.svg" alt=""> سري — للاستعمال الداخلي</footer>
</body>
</html>
