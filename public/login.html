<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d73237">
<title>شيكاتي — الدخول</title>
<link rel="icon" href="/img/symbol-red.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js"></script>
<script src="/js/login.js" defer></script>
</head>
<body>
<div class="login-wrap">
  <header class="topbar">
    <img class="logo" src="/img/logo-white.svg" alt="إيلوناك">
    <div class="actions"><button type="button" class="btn-ghost" data-theme-toggle>فاتح</button></div>
  </header>
  <main class="login-card">
    <h1>شيكاتي</h1>
    <p class="muted">متابعة شيكات العملاء وإيداعها في البنك.</p>
    <form id="login-form" novalidate>
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
      <label for="password">الرمز السري</label>
      <input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required>
      <div class="form-error" id="login-error" role="alert"></div>
      <button type="submit" class="btn-primary" id="login-btn">دخول</button>
    </form>
  </main>
  <footer class="foot"><img src="/img/symbol-red.svg" alt=""> سري — للاستعمال الداخلي</footer>
</div>
</body>
</html>
