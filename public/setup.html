<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d73237">
<title>شيكاتي — الإعداد الأولي</title>
<link rel="icon" href="/img/symbol-red.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شيكاتي">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/common.js"></script>
<script src="/js/setup.js" defer></script>
</head>
<body>
<div class="login-wrap">
  <header class="topbar">
    <img class="logo" src="/img/logo-white.svg" alt="إيلوناك">
    <div class="actions"><button type="button" class="btn-ghost" data-theme-toggle>فاتح</button></div>
  </header>
  <main class="login-card">
    <h1>الإعداد الأولي</h1>
    <p class="muted">إنشاء أول حساب مدير. هذه الصفحة تعمل مرة واحدة فقط.</p>
    <form id="setup-form" novalidate>
      <label for="token">رمز الإعداد</label>
      <input id="token" name="token" type="password" autocomplete="off" dir="ltr" required>
      <label for="display_name">الاسم الظاهر</label>
      <input id="display_name" name="display_name" value="ZEKRI" required>
      <label for="username">اسم الدخول</label>
      <input id="username" name="username" value="zekri" dir="ltr" autocapitalize="none" spellcheck="false" required>
      <label for="password">الرمز السري (10 أحرف على الأقل)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" dir="ltr" required>
      <label for="password2">أعد كتابة الرمز السري</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" dir="ltr" required>
      <div class="form-error" id="setup-error" role="alert"></div>
      <button type="submit" class="btn-primary" id="setup-btn">إنشاء حساب المدير</button>
    </form>
  </main>
  <footer class="foot"><img src="/img/symbol-red.svg" alt=""> سري — للاستعمال الداخلي</footer>
</div>
</body>
</html>
